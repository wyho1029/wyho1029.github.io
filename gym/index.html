<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181d">
<title>我的訓練</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 15px/1.5 -apple-system, "PingFang HK", "Microsoft JhengHei", system-ui, sans-serif;
         background: #f6f7f9; color: #16181d;
         padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
  #app { max-width: 520px; margin: 0 auto; padding: 12px; }
  .topbar { display: flex; justify-content: space-between; align-items: center;
            background: #16181d; color: #fff; padding: 10px 14px; font-size: 13px;
            position: sticky; top: 0; z-index: 5; }
  .dot { font-size: 11px; }
  .tabs { position: fixed; bottom: 0; left: 0; right: 0; display: flex; background: #fff;
          border-top: 1px solid #e4e7eb; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  .tabs button { flex: 1; border: 0; background: none; padding: 12px 0 10px; font-size: 11px;
                 color: #a2a9b4; font-family: inherit; cursor: pointer; }
  .tabs button.on { color: #16181d; font-weight: 700; box-shadow: inset 0 2px 0 #16181d; }
  .card { background: #fff; border: 1px solid #e4e7eb; border-radius: 12px;
          padding: 14px; margin-bottom: 12px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; background: #16181d;
         color: #fff; padding: 14px; font: 700 16px inherit; font-family: inherit; cursor: pointer; }
  .btn.ghost { background: #fff; color: #16181d; border: 1px solid #c9ced6; }
  .muted { color: #79818e; font-size: 13px; }
  input[type=number], input[type=password], input[type=text] {
    font: inherit; padding: 10px; border: 1px solid #c9ced6; border-radius: 8px; width: 100%; }
</style>
</head>
<body>

<div class="topbar">
  <span>💪 我的訓練</span>
  <span class="dot" id="syncDot">⚪ 未設定</span>
</div>

<div id="app"></div>

<div class="tabs">
  <button data-tab="home" class="on">首頁</button>
  <button data-tab="plan">計劃</button>
  <button data-tab="progress">進度</button>
  <button data-tab="settings">設定</button>
</div>

<script src="engine.js"></script>
<script>
'use strict';

var OWNER = 'wyho1029', REPO = 'gym-data', PATH = 'data.json', BRANCH = 'main';
var LS_DATA = 'gym.data', LS_TOKEN = 'gym.token', LS_SHA = 'gym.sha', LS_DIRTY = 'gym.dirty';
// 固定 key，唔加時間戳 —— 資料一日未修好，每次 reload 都會再存一次，
// 用時間戳就會無限堆積。同一份壞資料覆蓋自己冇損失。
var LS_CORRUPT = 'gym.data.corrupt';
var EMPTY = { v: 1, profile: null, prefs: { swaps: {}, banned: [] }, sessions: [] };

var Store = {
  data: null,
  sha: null,
  status: 'synced',
  _timer: null,

  token: function () { return localStorage.getItem(LS_TOKEN) || ''; },
  setToken: function (t) { localStorage.setItem(LS_TOKEN, t.trim()); },

  corrupted: false,

  load: function () {
    var raw = localStorage.getItem(LS_DATA);
    try {
      this.data = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(EMPTY));
    } catch (e) {
      // 本地資料壞咗。唔可以靜靜哋當佢唔存在 —— 下一次 saveLocal 就會用空資料
      // 蓋死成份訓練記錄。先另存一份原文，再舉手話俾使用者知。
      try { localStorage.setItem(LS_CORRUPT, raw); } catch (e2) {}
      this.data = JSON.parse(JSON.stringify(EMPTY));
      this.corrupted = true;
    }
    if (this.data.v !== 1) throw new Error('唔認識嘅資料版本 v=' + this.data.v + '，拒絕覆蓋');
    this.sha = localStorage.getItem(LS_SHA);
    if (localStorage.getItem(LS_DIRTY) === '1') this.setStatus('dirty');
    return this.data;
  },

  /** 每一組完成即刻叫，唔可以丟 */
  saveLocal: function () {
    localStorage.setItem(LS_DATA, JSON.stringify(this.data));
    localStorage.setItem(LS_DIRTY, '1');
    this.setStatus('dirty');
  },

  /** 每完成一個動作叫一次，debounce 5 秒 */
  schedulePush: function () {
    var self = this;
    clearTimeout(this._timer);
    this._timer = setTimeout(function () { self.push(); }, 5000);
  },

  setStatus: function (s) {
    this.status = s;
    var el = document.getElementById('syncDot');
    if (!el) return;
    el.textContent = s === 'synced' ? '🟢 已同步'
                   : s === 'dirty'  ? '🟡 待同步'
                   : '🔴 同步有問題';
  },

  _api: function (method, body) {
    var opts = {
      method: method,
      headers: {
        'Authorization': 'Bearer ' + this.token(),
        'Accept': 'application/vnd.github+json',
        'X-GitHub-Api-Version': '2022-11-28'
      }
    };
    if (body) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    return fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + PATH +
                 (method === 'GET' ? '?ref=' + BRANCH : ''), opts);
  },

  /** 由遠端拉落嚟並合併入本地 */
  pull: function () {
    var self = this;
    if (!this.token()) return Promise.resolve(null);
    return this._api('GET').then(function (res) {
      if (res.status === 401) { self.setStatus('error'); throw new Error('TOKEN_INVALID'); }
      if (res.status === 404) return null;                     // 遠端未有檔案
      if (!res.ok) { self.setStatus('error'); throw new Error('HTTP ' + res.status); }
      return res.json();
    }).then(function (j) {
      if (!j) return null;
      self.sha = j.sha;
      localStorage.setItem(LS_SHA, j.sha);
      var remote = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g, '')))));
      if (remote.v !== 1) { self.setStatus('error'); throw new Error('SCHEMA_MISMATCH'); }
      self.data = GymEngine.mergeData(self.data, remote);
      localStorage.setItem(LS_DATA, JSON.stringify(self.data));
      // 遠端資料成功merge入本地，壞資料已經唔再係當前狀態 —— 收返個紅色警告，
      // 否則個 banner 講「同步之後會還原返」但永遠唔兌現。
      self.corrupted = false;
      try { localStorage.removeItem(LS_CORRUPT); } catch (e) {}
      return self.data;
    });
  },

  /** 推上 GitHub。409/sha 過期 → 重新 pull 合併再推一次。 */
  push: function (isRetry) {
    var self = this;
    if (!this.token()) return Promise.resolve();
    var content = btoa(unescape(encodeURIComponent(JSON.stringify(this.data, null, 1) + '\n')));
    return this._api('PUT', {
      message: 'training log ' + new Date().toISOString().slice(0, 16),
      content: content, sha: this.sha || undefined, branch: BRANCH
    }).then(function (res) {
      if (res.status === 401) { self.setStatus('error'); throw new Error('TOKEN_INVALID'); }
      if ((res.status === 409 || res.status === 422) && !isRetry) {
        return self.pull().then(function () { return self.push(true); });
      }
      if (!res.ok) { self.setStatus('error'); throw new Error('HTTP ' + res.status); }
      return res.json().then(function (j) {
        self.sha = j.content.sha;
        localStorage.setItem(LS_SHA, self.sha);
        localStorage.setItem(LS_DIRTY, '0');
        self.setStatus('synced');
      });
    }).catch(function (err) {
      // TOKEN_INVALID 同 SCHEMA_MISMATCH 都係「再試都冇用」，一定要紅。
      // 🟡 嘅意思係「等陣自己會好」—— 用佢嚟表示一個永遠唔會好嘅狀態就係呃自己。
      if (err.message === 'TOKEN_INVALID' || err.message === 'SCHEMA_MISMATCH') {
        self.setStatus('error');
        return;
      }
      self.setStatus('dirty');       // 冇網：留返 dirty，下次開 app 補推
    });
  }
};

var Exercises = { list: [], byId: {} };

// 畫面登記表同路由狀態要喺呢度宣告 —— Task 7–10 嘅程式碼插喺路由區塊之前，
// 如果 `var Views = {}` 留喺下面，hoisting 會令 `Views.home = ...` 撞到 undefined。
var Views = {};
var currentTab = 'home';

function loadExercises() {
  return fetch('exercises.json').then(function (r) { return r.json(); }).then(function (list) {
    Exercises.list = list;
    list.forEach(function (e) { Exercises.byId[e.id] = e; });
  });
}

function today() { return new Date().toISOString().slice(0, 10); }

// ---- 首次執行 ----
function renderSetup(el) {
  el.innerHTML =
    '<div class="card">' +
      '<h2 style="margin-top:0">歡迎返嚟 💪</h2>' +
      '<p class="muted">先做三件事，之後唔使再設定。</p>' +
      '<p><b>1. 貼你嘅 GitHub token</b><br>' +
      '<span class="muted">Settings → Developer settings → Fine-grained tokens，' +
      '權限只需 gym-data 嘅 Contents: Read and write</span></p>' +
      '<input type="password" id="tk" placeholder="github_pat_...">' +
      '<p style="margin-top:18px"><b>2. 你一個禮拜想練幾多日？</b></p>' +
      '<div id="dpw"></div>' +
      '<p style="margin-top:18px"><b>3. 強度</b></p>' +
      '<div id="int"></div>' +
      '<p class="muted" style="margin-top:6px">「重」喺頭 4 週唔開放 —— 停練後肌肉恢復快過肌腱，' +
      '呢個落差就係最容易受傷嘅位。</p>' +
      '<button class="btn" id="go" style="margin-top:18px">開始</button>' +
      '<p class="muted" id="err" style="color:#c0392b"></p>' +
    '</div>';

  var dpw = 3, intensity = 'medium';

  function seg(host, opts, get, set) {
    host.innerHTML = '';
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:6px';
    opts.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.label;
      b.disabled = !!o.disabled;
      b.style.cssText = 'flex:1;padding:12px 0;border-radius:8px;font:inherit;cursor:pointer;border:1px solid ' +
        (get() === o.value ? '#16181d;background:#16181d;color:#fff'
                           : '#c9ced6;background:#fff;color:' + (o.disabled ? '#c4cad3' : '#16181d'));
      b.onclick = function () { set(o.value); seg(host, opts, get, set); };
      row.appendChild(b);
    });
    host.appendChild(row);
  }

  seg(document.getElementById('dpw'),
      [2, 3, 4, 5].map(function (n) { return { label: n + ' 日', value: n }; }),
      function () { return dpw; }, function (v) { dpw = v; });

  seg(document.getElementById('int'),
      [{ label: '輕', value: 'light' }, { label: '中', value: 'medium' },
       { label: '重 🔒', value: 'heavy', disabled: true }],
      function () { return intensity; }, function (v) { intensity = v; });

  document.getElementById('go').onclick = function () {
    var t = document.getElementById('tk').value.trim();
    if (!t) { document.getElementById('err').textContent = '要先貼 token 先開始得。'; return; }
    Store.setToken(t);
    Store.data.profile = {
      daysPerWeek: dpw, intensity: intensity, startDate: today(), unit: 'kg',
      increments: { upper: 2.5, lower: 5 },
      intensityUnlockedAt: null, intensityUnlockForced: false,
      updatedAt: new Date().toISOString()
    };
    Store.saveLocal();
    Store.push();
    render();
  };
}

// ---- 進行中嘅訓練 ----
var Session = { current: null };

function startWorkout() {
  var w = GymEngine.buildWorkout({
    profile: Store.data.profile, prefs: Store.data.prefs,
    exercises: Exercises.list, sessions: Store.data.sessions, today: today()
  });
  Session.current = {
    date: today(), day: w.day, done: false, note: '', restSec: w.restSec,
    entries: w.entries.map(function (e) {
      return { slot: e.slot, variant: e.variant, exerciseId: e.exerciseId,
               target: e.target, actual: [] };
    })
  };
  currentTab = 'workout';
  render();
}

// ---- 首頁 ----
Views.home = function (el) {
  if (!Store.data.profile) return renderSetup(el);
  var p = Store.data.profile;
  var doneList = Store.data.sessions.filter(function (s) { return s.done; });
  var last = doneList[doneList.length - 1];

  var html = '';

  if (last) {
    var days = Math.round((Date.parse(today()) - Date.parse(last.date)) / 86400000);
    html += '<div class="card"><div class="muted">上次訓練 · ' +
            (days === 0 ? '今日' : days + ' 日前') + '</div>' +
            '<div style="font-weight:700;margin:4px 0 8px">' + last.day +
            ' · 完成 ' + last.entries.length + ' 個動作</div>';
    last.entries.forEach(function (e) {
      var ex = Exercises.byId[e.exerciseId] || { name: e.exerciseId, metric: 'reps' };
      var reps = e.actual.map(function (a) { return a.r; }).join('/');
      var improved = didImprove(e.exerciseId, last);
      html += '<div style="display:flex;justify-content:space-between;padding:3px 0">' +
              '<span>' + ex.name + '</span>' +
              '<span style="' + (improved ? 'color:#22a06b;font-weight:700' : '') + '">' +
              (ex.metric === 'seconds' ? reps + ' 秒 × ' + e.actual.length
                                       : e.target.weight + ' × ' + reps) +
              (improved ? ' ↑' : '') + '</span></div>';
    });
    html += '</div>';
  } else {
    html += '<div class="card"><b>仲未開始</b><p class="muted">撳下面個掣做第一次訓練。' +
            '每個動作會問你大約做得起幾多，之後就唔使再估。</p></div>';
  }

  var next = GymEngine.nextDay(p, Store.data.sessions);
  var slotNames = { squat: '蹲', hinge: '髖鉸鏈', horizontal_push: '平推', vertical_push: '上推',
                    horizontal_pull: '平拉', vertical_pull: '上拉', core: '核心', accessory: '輔助' };
  html += '<div class="card" style="border:2px solid #16181d">' +
          '<div style="font-size:19px;font-weight:700">今日：' + next.day + '</div>' +
          '<div class="muted" style="margin:3px 0 12px">' +
          next.slots.map(function (s) { return slotNames[s.slot]; }).join(' · ') +
          '　約 45 分鐘</div>' +
          '<button class="btn" onclick="startWorkout()">開始訓練</button></div>';

  var wkIdx = GymEngine.weekIndex(p.startDate, today());
  var thisWeek = doneList.filter(function (s) {
    return GymEngine.weekIndex(p.startDate, s.date) === wkIdx;
  }).length;
  var pct = Math.min(100, Math.round(thisWeek / p.daysPerWeek * 100));
  html += '<div class="card"><div class="muted">本週 ' + thisWeek + ' / ' + p.daysPerWeek + ' 日</div>' +
          '<div style="height:8px;border-radius:4px;background:#e8ebef;margin-top:6px;overflow:hidden">' +
          '<div style="height:100%;width:' + pct + '%;background:#16181d"></div></div>';

  var u = GymEngine.heavyUnlock(p, Store.data.sessions, today());
  if (!u.unlocked) {
    html += '<div class="muted" style="margin-top:10px">Ramp-back 第 ' + (u.weeksDone + 1) +
            ' 週 · 完成 ' + u.sessionsDone + ' / ' + u.sessionsNeeded + ' 次解鎖「重」</div>';
  } else if (u.forced) {
    html += '<div class="muted" style="margin-top:10px">「重」已強制解鎖</div>';
  } else {
    html += '<div style="margin-top:10px;color:#22a06b;font-weight:700">4 週 ramp-back 完成 ✅ 重強度已開放</div>';
  }
  html += '</div>';

  el.innerHTML = html;
};

/** 該動作喺呢個 session 嘅目標重量／秒數係咪高過對上一次 */
function didImprove(exerciseId, session) {
  var idx = Store.data.sessions.indexOf(session);
  var prev = null;
  for (var i = idx - 1; i >= 0; i--) {
    if (!Store.data.sessions[i].done) continue;
    var e = Store.data.sessions[i].entries.filter(function (x) { return x.exerciseId === exerciseId; })[0];
    if (e) { prev = e; break; }
  }
  if (!prev) return false;
  var cur = session.entries.filter(function (x) { return x.exerciseId === exerciseId; })[0];
  var ex = Exercises.byId[exerciseId];
  return ex && ex.metric === 'seconds'
    ? cur.target.reps > prev.target.reps
    : cur.target.weight > prev.target.weight;
}

// ---- 設定 ----
Views.settings = function (el) {
  var p = Store.data.profile;
  if (!p) { el.innerHTML = '<div class="card muted">未完成初次設定。</div>'; return; }
  el.innerHTML =
    '<div class="card"><b>加重幅度</b>' +
      '<p class="muted">達標之後每次加幾多。最細 2.5kg（1.25kg 細片左右各一塊）。爬得太急就調細，但唔可以細過 2.5 —— 再細上唔到槓。</p>' +
      '<label class="muted">上肢 (kg)</label><input type="number" step="2.5" min="2.5" id="incU" value="' + p.increments.upper + '">' +
      '<label class="muted" style="display:block;margin-top:8px">下肢 (kg)</label>' +
      '<input type="number" step="2.5" min="2.5" id="incL" value="' + p.increments.lower + '">' +
      '<button class="btn" id="saveInc" style="margin-top:12px">儲存</button>' +
    '</div>' +
    '<div class="card"><b>GitHub Token</b>' +
      '<p class="muted">' + (Store.token() ? '已設定' : '未設定') + '</p>' +
      '<input type="password" id="tk2" placeholder="貼新 token 換走舊嗰個">' +
      '<button class="btn ghost" id="saveTk" style="margin-top:10px">更新 Token</button>' +
      '<button class="btn ghost" id="syncNow" style="margin-top:8px">立即同步</button>' +
    '</div>';

  // input 嘅 min/step 屬性喺直接讀 .value 時完全唔生效，要自己夾。
  // 打 1 入去，parseFloat('1') 係 truthy，`|| 2.5` 永遠唔會救到你 ——
  // 然後 nextTarget 加重時唔會再對齊，你會攞到 41kg / 42kg 呢啲上唔到槓嘅目標。
  function readIncrement(id, fallback) {
    var v = parseFloat(document.getElementById(id).value);
    if (!isFinite(v) || v <= 0) v = fallback;
    return Math.max(2.5, GymEngine.roundToStep(v, 2.5));
  }

  document.getElementById('saveInc').onclick = function () {
    p.increments.upper = readIncrement('incU', 2.5);
    p.increments.lower = readIncrement('incL', 5);
    p.updatedAt = new Date().toISOString();
    Store.saveLocal(); Store.push(); render();
  };
  document.getElementById('saveTk').onclick = function () {
    var t = document.getElementById('tk2').value.trim();
    // .catch(render) —— token 錯嘅話 pull 會 reject，冇 catch 就永遠唔會重畫，
    // 個畫面會繼續顯示舊 token 已設定，同紅點自相矛盾。
    if (t) { Store.setToken(t); Store.pull().then(render).catch(render); }
  };
  document.getElementById('syncNow').onclick = function () { Store.push().then(render); };
};

// ---- 訓練中 ----
var curIdx = 0;

Views.workout = function (el) {
  var s = Session.current;
  if (!s) { currentTab = 'home'; render(); return; }
  if (curIdx >= s.entries.length) curIdx = s.entries.length - 1;

  var e = s.entries[curIdx];
  var ex = Exercises.byId[e.exerciseId] || { name: e.exerciseId, nameEn: '', images: [], cues: [], metric: 'reps' };
  var timed = ex.metric === 'seconds';
  var lastRec = GymEngine.lastEntryFor(Store.data.sessions, e.exerciseId);

  var chips = s.entries.map(function (x, i) {
    var full = x.actual.length >= x.target.sets;
    var bg = full ? '#22a06b;color:#fff' : i === curIdx ? '#16181d;color:#fff' : '#e8ebef;color:#79818e';
    return '<button data-i="' + i + '" style="flex:1;height:38px;border:0;border-radius:8px;' +
           'font:600 13px inherit;cursor:pointer;background:' + bg + '">' +
           (full ? '✓' : (i + 1)) + '</button>';
  }).join('');

  var lastTxt = lastRec
    ? '上次 ' + (timed ? lastRec.entry.target.reps + ' 秒 × ' + lastRec.entry.actual.length
                       : lastRec.entry.target.weight + 'kg × ' +
                         lastRec.entry.actual.map(function (a) { return a.r; }).join('/'))
    : '第一次做呢個動作';

  var dots = [];
  for (var i = 0; i < e.target.sets; i++) dots.push(i < e.actual.length ? '●' : '○');

  el.innerHTML =
    '<div style="display:flex;gap:6px;margin-bottom:12px">' + chips + '</div>' +
    '<div class="card">' +
      (ex.images && ex.images[0]
        ? '<img src="' + ex.images[0] + '" alt="' + ex.name + '" loading="lazy" ' +
          'style="width:100%;border-radius:9px;background:#e8ebef" ' +
          'onerror="this.style.display=\'none\'">'
        : '') +
      '<div style="font-weight:700;font-size:17px;margin-top:8px">' + ex.name + '</div>' +
      '<div class="muted">' + (ex.nameEn || '') + '</div>' +
      '<div class="muted" style="margin:6px 0 12px">' + lastTxt + '</div>' +

      '<div style="display:flex;gap:8px">' +
        (timed ? '' :
        '<div style="flex:1;border:2px solid #16181d;border-radius:10px;padding:8px 4px;text-align:center">' +
          '<div class="muted" style="font-size:10px">重量 kg</div>' +
          '<input id="inW" type="number" step="1.25" value="' + e.target.weight + '" ' +
          'style="border:0;padding:0;text-align:center;font:700 22px inherit;width:100%">' +
        '</div>') +
        '<div style="flex:1;border:2px solid #16181d;border-radius:10px;padding:8px 4px;text-align:center">' +
          '<div class="muted" style="font-size:10px">' + (timed ? '秒數' : '次數') + '</div>' +
          '<input id="inR" type="number" value="' + e.target.reps + '" ' +
          'style="border:0;padding:0;text-align:center;font:700 22px inherit;width:100%">' +
        '</div>' +
        '<button id="logSet" style="flex:1;border:0;border-radius:10px;background:#22a06b;color:#fff;' +
        'font-size:26px;cursor:pointer">✓</button>' +
      '</div>' +

      '<div style="text-align:center;letter-spacing:6px;color:#b3bac4;font-size:17px;margin-top:12px">' +
      dots.join('') + '</div>' +
      '<div class="muted" style="text-align:center">已完成 ' + e.actual.length + ' / ' +
      e.target.sets + ' 組 · 休息 ' + Math.round(s.restSec / 60) + ' 分鐘</div>' +

      (ex.cues && ex.cues.length
        ? '<ul class="muted" style="margin:12px 0 0;padding-left:18px">' +
          ex.cues.map(function (c) { return '<li>' + c + '</li>'; }).join('') + '</ul>'
        : '') +
    '</div>' +

    '<div style="display:flex;gap:8px;margin-bottom:12px">' +
      '<button class="btn ghost" id="prev">← 上一個</button>' +
      '<button class="btn ghost" id="swap">換動作</button>' +
      '<button class="btn" id="next">下一個 →</button>' +
    '</div>' +
    '<button class="btn ghost" id="finish">結束訓練</button>';

  el.querySelector('div').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-i]');
    if (b) { curIdx = +b.dataset.i; render(); }
  });

  document.getElementById('logSet').onclick = function () {
    var w = timed ? 0 : parseFloat(document.getElementById('inW').value);
    var r = parseInt(document.getElementById('inR').value, 10);
    if (!(w >= 0 && w <= 500)) { alert('重量要喺 0–500 kg 之間'); return; }
    if (!(r > 0 && r <= 100) && !timed) { alert('次數要喺 1–100 之間'); return; }
    if (timed && !(r > 0 && r <= 600)) { alert('秒數要喺 1–600 之間'); return; }
    e.actual.push({ w: w, r: r });
    persistSession();
    render();
  };

  document.getElementById('prev').onclick = function () {
    if (curIdx > 0) { curIdx--; render(); }
  };
  document.getElementById('next').onclick = function () {
    Store.schedulePush();                       // 每完成一個動作先推一次
    if (curIdx < s.entries.length - 1) { curIdx++; render(); }
  };
  document.getElementById('swap').onclick = function () {
    var pool = Exercises.list.filter(function (x) {
      return x.slot === e.slot && (Store.data.prefs.banned || []).indexOf(x.id) < 0;
    }).sort(function (a, b) { return a.id < b.id ? -1 : 1; });
    if (pool.length < 2) return;
    var at = pool.findIndex(function (x) { return x.id === e.exerciseId; });
    var pick = pool[(at + 1) % pool.length];

    var t = GymEngine.nextTarget({
      sessions: Store.data.sessions, exerciseId: pick.id, exercise: pick,
      increments: Store.data.profile.increments,
      reps: pick.metric === 'seconds' ? 45 : e.target.reps,
      // 冇呢個，ramp-back 期內撳「換動作」就可以攞到閘門本應擋住嘅加重
      canIncrease: GymEngine.canIncreaseThisWeek(Store.data.sessions, pick.id,
                                                 Store.data.profile.startDate, today())
    });
    var fresh = {
      slot: e.slot, variant: e.variant, exerciseId: pick.id,
      target: { sets: e.target.sets, reps: t.reps, weight: t.weight },
      actual: []
    };

    if (e.actual.length) {
      // 已經做咗嘅組數係身體真係做過嘅嘢 —— 換動作唔可以抹走佢。
      // 保留舊 entry（結束時照樣記低），喺後面插入新動作，游標移過去。
      s.entries.splice(curIdx + 1, 0, fresh);
      curIdx++;
    } else {
      s.entries[curIdx] = fresh;
    }

    Store.data.prefs.swaps[e.slot + ':' + e.variant] = pick.id;
    Store.data.prefs.updatedAt = new Date().toISOString();
    persistSession();
    render();
  };

  document.getElementById('finish').onclick = function () {
    if (!confirm('結束今日訓練？')) return;
    s.entries = s.entries.filter(function (x) { return x.actual.length > 0; });
    if (!s.entries.length) {
      // 一組都冇做過。「換動作」嗰陣已經寫咗個 done:false session 落 storage，
      // 唔清走就會永遠留低一份空記錄，仲會推上 GitHub。
      Store.data.sessions = Store.data.sessions.filter(function (x) {
        return !(x.date === s.date && x.day === s.day && !x.done);
      });
      Store.saveLocal();
      Session.current = null; curIdx = 0; currentTab = 'home'; render(); return;
    }
    s.done = true;
    upsertSession(s);
    Session.current = null;
    curIdx = 0;
    Store.saveLocal();
    Store.push();
    currentTab = 'home';
    render();
  };
};

/** 把進行中嘅 session 寫返 Store（未 done，只為咗閃退唔會蝕） */
function persistSession() {
  upsertSession(Session.current);
  Store.saveLocal();
}

function upsertSession(s) {
  var at = Store.data.sessions.findIndex(function (x) {
    return x.date === s.date && x.day === s.day;
  });
  if (at >= 0) Store.data.sessions[at] = s;
  else Store.data.sessions.push(s);
}

// ---- 計劃 ----
Views.plan = function (el) {
  var p = Store.data.profile;
  if (!p) { el.innerHTML = '<div class="card muted">未完成初次設定。</div>'; return; }
  var u = GymEngine.heavyUnlock(p, Store.data.sessions, today());
  var split = GymEngine.splitFor(p.daysPerWeek);
  var wkIdx = GymEngine.weekIndex(p.startDate, today());
  var doneThisWeek = Store.data.sessions.filter(function (s) {
    return s.done && GymEngine.weekIndex(p.startDate, s.date) === wkIdx;
  });
  var nextDay = GymEngine.nextDay(p, Store.data.sessions).day;

  function segHtml(id, opts, cur) {
    return '<div id="' + id + '" style="display:flex;gap:6px">' + opts.map(function (o) {
      var style = o.value === cur ? 'border:1px solid #16181d;background:#16181d;color:#fff'
                : o.locked      ? 'border:1px solid #eceef1;background:#f4f5f7;color:#c4cad3'
                                : 'border:1px solid #c9ced6;background:#fff;color:#16181d';
      return '<button data-v="' + o.value + '" style="flex:1;padding:12px 0;border-radius:8px;' +
             'font:inherit;cursor:pointer;' + style + '">' + o.label + '</button>';
    }).join('') + '</div>';
  }

  var html =
    '<div class="card">' +
      '<div class="muted" style="margin-bottom:6px">每週練幾多日</div>' +
      segHtml('segDays', [2, 3, 4, 5].map(function (n) { return { label: n, value: n }; }), p.daysPerWeek) +
      '<div class="muted" style="margin:14px 0 6px">強度</div>' +
      segHtml('segInt', [
        { label: '輕', value: 'light' },
        { label: '中', value: 'medium' },
        { label: u.unlocked ? '重' : '重 🔒', value: 'heavy', locked: !u.unlocked }
      ], p.intensity) +
    '</div>';

  split.forEach(function (d) {
    var doneRec = doneThisWeek.filter(function (s) { return s.day === d.day; })[0];
    var tag = doneRec ? '<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:#e3f4ec;color:#1a7f55">已完成 ' + doneRec.date.slice(5) + '</span>'
            : d.day === nextDay ? '<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:#16181d;color:#fff">今日</span>'
            : '<span style="font-size:10px;padding:2px 8px;border-radius:20px;background:#eceef1;color:#79818e">未開始</span>';

    html += '<div class="card"><div style="display:flex;justify-content:space-between;' +
            'align-items:center;font-weight:700;margin-bottom:6px"><span>' + d.day + '</span>' + tag + '</div>';

    d.slots.forEach(function (spec) {
      var ex = GymEngine.pickExercise(spec, Exercises.list, Store.data.prefs);
      if (!ex) return;
      html += '<div style="display:flex;justify-content:space-between;align-items:center;' +
              'padding:7px 0;border-bottom:1px solid #f2f4f6"><span>' + ex.name + '</span>' +
              (doneRec ? '' : '<button data-swap="' + spec.slot + ':' + spec.variant +
                '" style="font-size:11px;border:1px solid #c9ced6;border-radius:6px;' +
                'padding:3px 9px;background:#fff;color:#79818e;cursor:pointer">換</button>') +
              '</div>';
    });
    html += '</div>';
  });

  el.innerHTML = html;

  document.getElementById('segDays').onclick = function (ev) {
    var b = ev.target.closest('button[data-v]');
    if (!b) return;
    p.daysPerWeek = +b.dataset.v;
    p.updatedAt = new Date().toISOString();
    Store.saveLocal(); Store.push(); render();
  };

  document.getElementById('segInt').onclick = function (ev) {
    var b = ev.target.closest('button[data-v]');
    if (!b) return;
    var v = b.dataset.v;
    if (v === 'heavy' && !u.unlocked) { showHeavyGate(u); return; }
    p.intensity = v;
    p.updatedAt = new Date().toISOString();
    Store.saveLocal(); Store.push(); render();
  };

  // 用 .onclick= 而唔係 addEventListener —— el（#app）每次切去「計劃」tab
  // 都係同一個 DOM node，只有 innerHTML 會被清空。用 addEventListener 會
  // 一次疊一次，換一次動作可能觸發幾次、跳過晒個 pool。.onclick= 淨係揸實
  // 一個 handler，唔會疊。
  el.onclick = function (ev) {
    var b = ev.target.closest('button[data-swap]');
    if (!b) return;
    var parts = b.dataset.swap.split(':');
    var spec = { slot: parts[0], variant: +parts[1] };
    var pool = Exercises.list.filter(function (x) {
      return x.slot === spec.slot && (Store.data.prefs.banned || []).indexOf(x.id) < 0;
    }).sort(function (a, b2) { return a.id < b2.id ? -1 : 1; });
    if (pool.length < 2) return;
    var cur = GymEngine.pickExercise(spec, Exercises.list, Store.data.prefs);
    var at = pool.findIndex(function (x) { return x.id === cur.id; });
    Store.data.prefs.swaps[b.dataset.swap] = pool[(at + 1) % pool.length].id;
    Store.data.prefs.updatedAt = new Date().toISOString();
    Store.saveLocal(); Store.push(); render();
  };
};

/** 「重」強度閘門 —— 擋衝動，唔擋人。要撳兩次先解鎖。 */
function showHeavyGate(u) {
  var left = Math.max(0, u.sessionsNeeded - u.sessionsDone);
  var weeksLeft = Math.max(0, u.weeksNeeded - u.weeksDone);
  var msg = '重新開始頭 ' + u.weeksNeeded + ' 週唔開放「重」強度。\n\n' +
            '停練之後肌肉恢復快過肌腱同韌帶 —— 你感覺推得起，但結締組織未 ready，' +
            '呢個落差就係最容易受傷嘅位。\n\n' +
            '仲差：' + weeksLeft + ' 週、' + left + ' 次訓練。';
  if (!confirm(msg + '\n\n撳「取消」等佢自然解鎖；撳「確定」進入強制解鎖。')) return;
  if (!confirm('確認強制解鎖？\n\n頭 4 週用重強度受傷風險較高，呢個決定會記錄低。')) return;

  var p = Store.data.profile;
  p.intensityUnlockedAt = today();
  p.intensityUnlockForced = true;
  p.intensity = 'heavy';
  p.updatedAt = new Date().toISOString();
  Store.saveLocal(); Store.push(); render();
}

// ---- 進度 ----
var progressExId = null;

Views.progress = function (el) {
  var done = Store.data.sessions.filter(function (s) { return s.done; });
  if (!done.length) {
    el.innerHTML = '<div class="card muted">仲未有訓練記錄。做完第一次訓練就會見到走勢圖。</div>';
    return;
  }

  var ids = [];
  done.forEach(function (s) {
    s.entries.forEach(function (e) { if (ids.indexOf(e.exerciseId) < 0) ids.push(e.exerciseId); });
  });
  if (!progressExId || ids.indexOf(progressExId) < 0) progressExId = ids[0];

  var ex = Exercises.byId[progressExId] || { name: progressExId, metric: 'reps' };
  var timed = ex.metric === 'seconds';

  var pts = [];
  done.forEach(function (s) {
    s.entries.forEach(function (e) {
      if (e.exerciseId !== progressExId) return;
      pts.push({ date: s.date, v: timed ? e.target.reps : e.target.weight });
    });
  });
  // 一定要自己按日期排，唔可以靠 sessions 陣列本身嘅次序。mergeData 每次 pull 會排返，
  // 但 upsertSession 淨係 append —— 時鐘偏差、兩部裝置、或者手動注入都會令次序同日期唔一致。
  // 圖表嘅 delta、deload 標記、日期標籤全部靠呢個次序，錯咗係靜靜哋出錯數，唔會 crash。
  pts.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });

  var html =
    '<div class="card"><div class="muted" style="margin-bottom:6px">動作</div>' +
    '<select id="exSel" style="width:100%;font:inherit;padding:10px;border:1px solid #c9ced6;border-radius:8px">' +
    ids.map(function (id) {
      var n = (Exercises.byId[id] || {}).name || id;
      return '<option value="' + id + '"' + (id === progressExId ? ' selected' : '') + '>' + n + '</option>';
    }).join('') + '</select>';

  if (pts.length < 2) {
    html += '<p class="muted" style="margin-top:12px">再做多一次呢個動作就會出走勢圖。</p></div>';
  } else {
    var vals = pts.map(function (p) { return p.v; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var pad = (max - min) * 0.15 || 5;
    var lo = min - pad, hi = max + pad;
    var W = 260, H = 130, L = 32, R = 250, T = 12, B = 108;

    var xy = pts.map(function (p, i) {
      var x = pts.length === 1 ? (L + R) / 2 : L + (R - L) * i / (pts.length - 1);
      var y = B - (B - T) * (p.v - lo) / (hi - lo);
      return { x: Math.round(x * 10) / 10, y: Math.round(y * 10) / 10, v: p.v, date: p.date };
    });

    var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;margin-top:12px">';
    [0, 0.5, 1].forEach(function (f) {
      var y = T + (B - T) * f;
      svg += '<line x1="' + L + '" y1="' + y + '" x2="' + R + '" y2="' + y + '" stroke="#f0f2f4"/>' +
             '<text x="2" y="' + (y + 4) + '" font-size="9" fill="#a2a9b4">' +
             Math.round(hi - (hi - lo) * f) + '</text>';
    });
    svg += '<polyline points="' + xy.map(function (p) { return p.x + ',' + p.y; }).join(' ') +
           '" fill="none" stroke="#16181d" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    xy.forEach(function (p, i) {
      var isDeload = i > 0 && p.v < xy[i - 1].v;
      svg += isDeload
        ? '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="#fff" stroke="#e8833a" stroke-width="2.5"/>'
        : (i === xy.length - 1 ? '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="#16181d"/>' : '');
    });
    svg += '<text x="' + L + '" y="126" font-size="9" fill="#a2a9b4">' + pts[0].date.slice(5) + '</text>' +
           '<text x="' + (R - 28) + '" y="126" font-size="9" fill="#a2a9b4">' + pts[pts.length - 1].date.slice(5) + '</text>' +
           '</svg>';

    var delta = pts[pts.length - 1].v - pts[0].v;
    var unit = timed ? ' 秒' : 'kg';
    html += svg +
      '<div style="text-align:center;font-weight:700;color:' + (delta >= 0 ? '#22a06b' : '#e8833a') + '">' +
      (delta >= 0 ? '+' : '') + delta + unit + '（' + pts.length + ' 次記錄）</div>';
    if (xy.some(function (p, i) { return i > 0 && p.v < xy[i - 1].v; })) {
      html += '<div class="muted" style="text-align:center;font-size:12px">橙色點 = deload。跌唔係失敗，係系統叫你退返落去再爬。</div>';
    }
    html += '</div>';
  }

  // 出席日曆（最近 28 日）
  var hits = {};
  done.forEach(function (s) { hits[s.date] = true; });
  var cells = '';
  for (var i = 27; i >= 0; i--) {
    var d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
    cells += '<i style="display:block;width:100%;aspect-ratio:1;border-radius:50%;background:' +
             (hits[d] ? '#22a06b' : '#eceef1') + '"></i>';
  }
  html += '<div class="card"><div class="muted" style="margin-bottom:8px">最近 4 週出席</div>' +
          '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">' + cells + '</div>' +
          '<div class="muted" style="text-align:center;margin-top:8px">' + done.length + ' 次訓練</div></div>';

  el.innerHTML = html;
  document.getElementById('exSel').onchange = function () {
    progressExId = this.value;
    render();
  };
};

// ---- 路由（Task 7–10 會填返每個畫面）----
function render() {
  var el = document.getElementById('app');
  el.innerHTML = '';
  if (Store.corrupted) {
    el.innerHTML =
      '<div class="card" style="border-color:#c0392b">' +
      '<b style="color:#c0392b">本地資料讀唔到</b>' +
      '<p class="muted">壞咗嗰份已經另存喺瀏覽器，冇刪走。' +
      '如果 GitHub 有備份，同步之後會還原返。</p></div>';
  }
  var fn = Views[currentTab];
  if (fn) fn(el);
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'), function (b) {
    b.classList.toggle('on', b.dataset.tab === currentTab);
  });
  // 訓練進行中時，tab bar 顯示「訓練中」而唔係「首頁」高亮
  var homeBtn = document.querySelector('.tabs button[data-tab="home"]');
  if (homeBtn) {
    homeBtn.textContent = Session.current ? '訓練中' : '首頁';
    if (currentTab === 'workout') homeBtn.classList.add('on');
  }
}

document.querySelector('.tabs').addEventListener('click', function (e) {
  var b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.tab === 'home' && Session.current) { currentTab = 'workout'; render(); return; }
  currentTab = b.dataset.tab;
  render();
});

// ---- 啟動 ----
// 網絡出事**唔可以**令個 app 用唔到 —— gym 地牢冇訊號正正係本地優先嘅原因。
// 所以 pull / push 各自食晒自己嘅錯，只反映喺右上角粒點度。
// 最外層 catch 只剩返真正致命嘅嘢：本地資料版本唔認識、或者 exercises.json 載入唔到。
Promise.resolve()
  .then(function () { Store.load(); return loadExercises(); })
  .then(function () {
    render();                       // 先用本地資料畫出嚟，唔等網絡
    return Store.pull().catch(function (err) {
      if (err && (err.message === 'TOKEN_INVALID' || err.message === 'SCHEMA_MISMATCH')) {
        Store.setStatus('error');
      } else {
        Store.setStatus('dirty');   // 冇訊號：本地照用，下次再同步
      }
      return null;
    });
  })
  .then(function () {
    if (localStorage.getItem(LS_DIRTY) === '1') return Store.push();   // 補推上次冇推成嘅
  })
  .then(function () { render(); })
  .catch(function (err) {
    document.getElementById('app').innerHTML =
      '<div class="card"><b>啟動失敗</b><p class="muted">' + err.message + '</p></div>';
  });
</script>
</body>
</html>
